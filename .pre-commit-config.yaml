repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: end-of-file-fixer
  - repo: local
    hooks:
      - id: mypy
        name: mypy (src only)
        entry: uv run mypy --strict src/
        language: system
        pass_filenames: false
        files: ^src/
      - id: no-raw-data
        name: reject data/ paths and .csv.gz
        entry: uv run python scripts/check_repo_guard.py
        language: system
